<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatFincare - Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-header">
        <img src="logo-2.png" alt="BharatFincare Logo" class="logo">
        <h1>Admin Control Dashboard</h1>
        <div class="connection-status">
            <span class="status-indicator" id="connection-status"></span>
            <span>Live Connection</span>
        </div>
    </div>

    <div class="admin-container">
        <!-- Quick Actions -->
        <div class="quick-actions">
            <button id="open-display" class="btn btn--secondary">📺 Open Display Dashboard</button>
            <button id="reset-all" class="btn btn--outline">🔄 Reset All Data</button>
        </div>

        <!-- Control Panels -->
        <div class="control-panels">
            <!-- ELI Control Panel -->
            <div class="control-panel eli-panel">
                <div class="panel-header">
                    <h2>ELI Team Controls</h2>
                    <div class="panel-status" id="eli-panel-status">Ready</div>
                </div>

                <div class="control-grid">
                    <!-- Fresh Leads -->
                    <div class="control-item">
                        <label for="eli-fresh">Fresh Leads</label>
                        <div class="input-with-buttons">
                            <button class="btn-adjust" onclick="adjustValue('eli-fresh', -1)">-</button>
                            <input type="number" id="eli-fresh" min="0" value="0">
                            <button class="btn-adjust" onclick="adjustValue('eli-fresh', 1)">+</button>
                        </div>
                    </div>

                    <!-- Total Amount -->
                    <div class="control-item">
                        <label for="eli-amount">Total Amount (₹)</label>
                        <input type="text" id="eli-amount" inputmode="numeric" placeholder="e.g., 2500000">
                    </div>

                    <!-- Disbursement -->
                    <div class="control-item">
                        <label for="eli-disbursement">Disbursement (₹)</label>
                        <input type="text" id="eli-disbursement" inputmode="numeric" placeholder="e.g., 35000000">
                        <div class="target-info">Target: ₹45,500,000</div>
                    </div>

                    <!-- Collection -->
                    <div class="control-item">
                        <label for="eli-collection">Collection (₹)</label>
                        <input type="text" id="eli-collection" inputmode="numeric" placeholder="e.g., 40000000">
                        <div class="target-info">Target: ₹46,955,310</div>
                    </div>
                </div>

                <button class="btn btn--primary panel-update" onclick="updateTeam('eli')">
                    Update ELI Data
                </button>
            </div>

            <!-- NBL Control Panel -->
            <div class="control-panel nbl-panel">
                <div class="panel-header">
                    <h2>NBL Team Controls</h2>
                    <div class="panel-status" id="nbl-panel-status">Ready</div>
                </div>

                <div class="control-grid">
                    <!-- Fresh Leads -->
                    <div class="control-item">
                        <label for="nbl-fresh">Fresh Leads</label>
                        <div class="input-with-buttons">
                            <button class="btn-adjust" onclick="adjustValue('nbl-fresh', -1)">-</button>
                            <input type="number" id="nbl-fresh" min="0" value="0">
                            <button class="btn-adjust" onclick="adjustValue('nbl-fresh', 1)">+</button>
                        </div>
                    </div>

                    <!-- Total Amount -->
                    <div class="control-item">
                        <label for="nbl-amount">Total Amount (₹)</label>
                        <input type="text" id="nbl-amount" inputmode="numeric" placeholder="e.g., 3000000">
                    </div>

                    <!-- Disbursement -->
                    <div class="control-item">
                        <label for="nbl-disbursement">Disbursement (₹)</label>
                        <input type="text" id="nbl-disbursement" inputmode="numeric" placeholder="e.g., 38000000">
                        <div class="target-info">Target: ₹50,000,000</div>
                    </div>

                    <!-- Collection -->
                    <div class="control-item">
                        <label for="nbl-collection">Collection (₹)</label>
                        <input type="text" id="nbl-collection" inputmode="numeric" placeholder="e.g., 45000000">
                        <div class="target-info">Target: ₹51,989,851</div>
                    </div>
                </div>

                <button class="btn btn--primary panel-update" onclick="updateTeam('nbl')">
                    Update NBL Data
                </button>
            </div>
        </div>

        <!-- Bulk Update Section -->
        <div class="bulk-update-section">
            <h3>Quick Sample Data</h3>
            <div class="sample-buttons">
                <button class="btn btn--sample" onclick="loadSample(1)">
                    📊 Sample Data 1
                    <small>Moderate Progress</small>
                </button>
                <button class="btn btn--sample" onclick="loadSample(2)">
                    📈 Sample Data 2
                    <small>High Performance</small>
                </button>
                <button class="btn btn--sample" onclick="loadSample(3)">
                    🎯 Target Achievement
                    <small>Near Completion</small>
                </button>
            </div>

            <button id="update-all" class="btn btn--success btn--lg">
                ⚡ Update All Data Live
            </button>
        </div>

        <!-- Activity Log -->
        <div class="activity-log">
            <h3>Activity Log</h3>
            <div id="log-container" class="log-container">
                <div class="log-item">
                    <span class="log-time">Ready to start</span>
                    <span class="log-message">Admin dashboard initialized</span>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
